name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: |
          mkdir -p data
          curl -L -o data/sms.zip "https://archive.ics.uci.edu/static/public/228/sms+spam+collection.zip"
          cd data && unzip -o sms.zip && mv SMSSpamCollection spam.csv && cd ..

      - name: Train model (generates pkl for tests)
        run: BASELINE=0 python -m ml.train

      - name: Lint (ruff)
        run: ruff check app ml tests

      - name: Format check (black)
        run: black --check app ml tests

      - name: Run tests
        run: pytest tests/ -v

      - name: Build Docker image
        run: docker build -t spam-detector:ci .

  # 合并到 staging 后：用 staging secrets 生成 .env，构建 staging 镜像
  deploy-staging:
    needs: test-lint-build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write staging .env from secrets
        run: echo "${{ secrets.STAGING_ENV }}" > .env

      - name: Build staging Docker image
        run: docker build -t spam-detector:staging .

  # 合并到 main 后：用 production secrets 生成 .env，构建生产镜像
  deploy-prod:
    needs: test-lint-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write production .env from secrets
        run: echo "${{ secrets.PROD_ENV }}" > .env

      - name: Build production Docker image
        run: docker build -t spam-detector:prod .
